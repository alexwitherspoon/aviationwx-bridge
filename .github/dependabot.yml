# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Go modules (go.mod / go.sum)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(go)"
    labels:
      - dependencies
      - go
    open-pull-requests-limit: 10

  # GitHub Actions (.github/workflows/*.yml)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(ci)"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 10

  # npm (package.json / package-lock.json — dev tooling e.g. Bats)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(npm)"
    labels:
      - dependencies
      - npm
    open-pull-requests-limit: 5

  # Docker base images (docker/Dockerfile, docker/docker-compose.yml)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(docker)"
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 5
