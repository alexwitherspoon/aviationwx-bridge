name: PR Checks

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-checks:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum
      
      - name: Download dependencies
        run: go mod download

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run shell (Bats) tests
        run: npm run test:sh
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run gofmt check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted. Run 'gofmt -s -w .'"
            gofmt -s -d .
            exit 1
          fi
          echo "✓ Code is properly formatted"
      
      - name: Check for sensitive data
        run: |
          # Check for potential secrets in code
          if grep -r "password.*=.*['\"].*[a-zA-Z0-9]{8,}" --include="*.go" . | grep -v "example\|test\|TODO"; then
            echo "⚠️  Potential hardcoded password found"
            exit 1
          fi
          echo "✓ No obvious hardcoded secrets found"
      
      - name: Validate config example
        run: |
          if [ -f "configs/config.json.example" ]; then
            python3 -m json.tool configs/config.json.example > /dev/null
            echo "✓ config.json.example is valid JSON"
          fi









