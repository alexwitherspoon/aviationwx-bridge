name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
      critical:
        description: 'Is this a critical security update?'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: alexwitherspoon/aviationwx-org-bridge

jobs:
  # Build Go binaries for multiple architectures
  build-binaries:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GIT_COMMIT=$(git rev-parse --short HEAD)
          go build -ldflags="-w -s -X main.Version=${{ steps.version.outputs.VERSION_NUM }} -X main.GitCommit=${GIT_COMMIT}" \
            -o dist/aviationwx-org-bridge-${{ matrix.suffix }} \
            ./cmd/bridge

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aviationwx-org-bridge-${{ matrix.suffix }}
          path: dist/aviationwx-org-bridge-${{ matrix.suffix }}

  # Build and push Docker images
  build-docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION_NUM }}
            GIT_COMMIT=${{ steps.version.outputs.GIT_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Create GitHub Release
  release:
    runs-on: ubuntu-26.04
    needs: [build-binaries, build-docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            CRITICAL="${{ github.event.inputs.critical }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
            CRITICAL="false"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "CRITICAL=${CRITICAL}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Prepare release assets
        run: |
          cd dist
          # download-artifact nests each artifact under dist/<name>/; flatten to dist/
          for dir in */; do
            dirname="${dir%/}"
            if [ -f "${dir}${dirname}" ]; then
              echo "Moving ${dir}${dirname} to ./${dirname}"
              mv "${dir}${dirname}" "./${dirname}.tmp"
            fi
          done
          # Remove subdirectories
          rm -rf */
          # Rename .tmp files back
          for file in *.tmp; do
            mv "$file" "${file%.tmp}"
          done
          # List final structure
          ls -lh
          # Make binaries executable and create checksums
          chmod +x aviationwx-org-bridge-*
          sha256sum aviationwx-org-bridge-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: AviationWX.org Bridge ${{ steps.version.outputs.VERSION }}
          body: |
            ## AviationWX.org Bridge ${{ steps.version.outputs.VERSION }}
            
            <!-- AVIATIONWX_RELEASE_META {"version": "${{ steps.version.outputs.VERSION_NUM }}", "min_host_version": "2.4", "critical": ${{ steps.version.outputs.CRITICAL }}, "force_update": false, "rollback_safe": true} -->
            
            ### Installation
            
            #### Supervised Install (single-board computer, recommended)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/alexwitherspoon/aviationwx-bridge/main/scripts/install.sh | sudo bash
            ```
            
            #### Docker
            ```bash
            docker pull ghcr.io/alexwitherspoon/aviationwx-org-bridge:${{ steps.version.outputs.VERSION_NUM }}
            ```
            
            ### Migration (from aviationwx-bridge or aviationwx.org-bridge image)
            
            If you previously used `ghcr.io/alexwitherspoon/aviationwx.org-bridge`, switch to `ghcr.io/alexwitherspoon/aviationwx-org-bridge`. GHCR does not redirect.
            
            **Supervised install:** Re-run the install script above (idempotent; preserves config).
            
            **Docker:** Stop and remove the old container, then pull and run from `ghcr.io/alexwitherspoon/aviationwx-org-bridge` (see Installation).
            
            ### Docker Images
            
            Available at `ghcr.io/alexwitherspoon/aviationwx-org-bridge`:
            - `:${{ steps.version.outputs.VERSION_NUM }}` - This specific version
            - `:latest` - Latest stable release
            
            **Supported platforms:** `linux/amd64`, `linux/arm64`, `linux/arm/v7`
            
            ### Binaries
            
            Download standalone binaries for your platform from the assets below.
            
            | Platform | Binary |
            |----------|--------|
            | Linux (x86_64) | `aviationwx-org-bridge-linux-amd64` |
            | Linux (ARM64, e.g. Pi 4/5, Radxa, Orange Pi) | `aviationwx-org-bridge-linux-arm64` |
            | Linux (ARMv7, 32-bit, e.g. Pi 3) | `aviationwx-org-bridge-linux-armv7` |
            | macOS (Intel) | `aviationwx-org-bridge-darwin-amd64` |
            | macOS (Apple Silicon) | `aviationwx-org-bridge-darwin-arm64` |
            
            ### Changelog
            
            See [CHANGELOG.md](https://github.com/alexwitherspoon/aviationwx-bridge/blob/main/CHANGELOG.md) for details.
          files: |
            dist/aviationwx-org-bridge-*
            dist/checksums.txt
          draft: false
          prerelease: false
