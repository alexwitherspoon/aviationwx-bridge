server {
    listen 443 ssl;
    server_name upload.e2e.test;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    location = /.well-known/aviationwx-upload-ssh-host-keys.json {
        proxy_pass http://127.0.0.1:80/api/upload-ssh-host-keys.php;
        proxy_set_header Host upload.e2e.test;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "no-store, no-cache, must-revalidate, private, max-age=0, s-maxage=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        return 404;
    }
}
